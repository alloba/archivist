name: Download Content
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'


jobs:
  Download:
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Node setup
        uses: actions/setup-node@v4
      - name: Project pull
        uses: actions/checkout@v4
      - name: Dependency pull
        run: npm ci
      # Each run saves to both S3 and the NAS. The NAS folder is bind-mounted into the job container by the
      # gitea runner config (see README, "Saving to a NAS from CI"). requireManifest makes the run fail
      # instead of writing into the container's own disk if the mount is missing, and on the S3 side
      # instead of downloading every object to hash it if the manifest is missing.
      - name: Media download
        run: |
          npm run start -- --source.type 4chan --source.path wsg --source.search ygyl    --destination.0.type s3 --destination.0.region us-east-1 --destination.0.bucket kaleidoscope-media --destination.0.path wsg --destination.0.requireManifest      --destination.1.type fs --destination.1.path /archive/kaleidoscope-media/wsg     --destination.1.requireManifest --serious
          npm run start -- --source.type 4chan --source.path wsg --source.search gondola --destination.0.type s3 --destination.0.region us-east-1 --destination.0.bucket kaleidoscope-media --destination.0.path gondola --destination.0.requireManifest  --destination.1.type fs --destination.1.path /archive/kaleidoscope-media/gondola --destination.1.requireManifest --serious
          npm run start -- --source.type 4chan --source.path wsg --source.search comfy   --destination.0.type s3 --destination.0.region us-east-1 --destination.0.bucket kaleidoscope-media --destination.0.path comfy --destination.0.requireManifest    --destination.1.type fs --destination.1.path /archive/kaleidoscope-media/comfy   --destination.1.requireManifest --serious
